<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 252 56" width="252" height="56" role="img" aria-label="Kompas TV">
  <title>Kompas TV</title>
  <!--
    PLACEHOLDER WORDMARK.
    Ganti file ini dengan aset logo resmi Kompas TV dari brand guideline internal
    (SVG, latar transparan, versi terang untuk background gelap).
    Nama file & ukuran render dijaga sama agar layout tidak berubah.
  -->
  <defs>
    <linearGradient id="kgBadge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#3E8BFF"/>
      <stop offset="100%" stop-color="#0F3BB5"/>
    </linearGradient>
  </defs>

  <text x="0" y="41"
        font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="40" font-weight="800" letter-spacing="-1.6" fill="#F2F6FF">KOMPAS</text>

  <rect x="180" y="9" width="70" height="38" rx="11" fill="url(#kgBadge)"/>
  <text x="215" y="36" text-anchor="middle"
        font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="24" font-weight="800" letter-spacing="0.5" fill="#FFFFFF">TV</text>
</svg>
